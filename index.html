<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小學二年級：趣味乘法大挑戰</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: 圓體風格 -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
    <!-- Canvas Confetti 特效 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            min-height: 100vh;
        }
        .bouncing {
            animation: bounce 0.5s infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }
        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4">

    <!-- 頂部導覽列 -->
    <div class="w-full max-w-xl flex justify-between items-center mb-4 px-2">
        <h1 class="text-2xl font-extrabold text-white drop-shadow-md flex items-center gap-2">
            🦁 乘法冒險王
        </h1>
        <button onclick="openLeaderboard()" class="bg-white/80 hover:bg-white text-orange-600 font-bold px-4 py-2 rounded-full shadow transition flex items-center gap-1 text-sm">
            🏆 排行榜
        </button>
    </div>

    <!-- 主遊戲容器 -->
    <div class="w-full max-w-xl bg-white rounded-3xl card-shadow p-6 md:p-8 relative overflow-hidden border-4 border-yellow-300">
        
        <!-- 畫面一：登入畫面 (輸入班別、姓名) -->
        <div id="login-screen" class="space-y-6">
            <div class="text-center space-y-2">
                <div class="text-5xl mb-2">⭐</div>
                <h2 class="text-2xl font-black text-gray-800">歡迎來到口訣大挑戰！</h2>
                <p class="text-gray-500 text-sm">請輸入你的班別與姓名開始闖關</p>
            </div>

            <div class="space-y-4 max-w-sm mx-auto">
                <div>
                    <label class="block text-gray-700 font-bold mb-1 text-sm">選擇班別：</label>
                    <select id="student-class" class="w-full px-4 py-3 rounded-xl border-2 border-orange-200 focus:border-orange-500 focus:outline-none text-lg font-bold bg-orange-50/50">
                        <option value="2A">2A 班</option>
                        <option value="2B">2B 班</option>
                        <option value="2C">2C 班</option>
                        <option value="2D">2D 班</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-700 font-bold mb-1 text-sm">你的姓名：</label>
                    <input type="text" id="student-name" placeholder="例如：陳大文" class="w-full px-4 py-3 rounded-xl border-2 border-orange-200 focus:border-orange-500 focus:outline-none text-lg font-bold bg-orange-50/50">
                </div>
                <button onclick="startGame()" class="w-full bg-gradient-to-r from-orange-400 to-yellow-400 hover:from-orange-500 hover:to-yellow-500 text-white font-extrabold py-3.5 rounded-2xl shadow-lg text-xl transition transform active:scale-95">
                    🚀 開始挑戰！
                </button>
            </div>
        </div>

        <!-- 畫面二：遊戲進行中 -->
        <div id="game-screen" class="hidden space-y-6">
            <!-- 頂部資訊列 (分數、進度、計時) -->
            <div class="flex justify-between items-center bg-orange-50 px-4 py-2.5 rounded-2xl border border-orange-100">
                <div class="text-sm font-bold text-orange-800">
                    題號：<span id="current-question">1</span> / 10
                </div>
                <div class="text-sm font-bold text-purple-700">
                    得分：<span id="current-score" class="text-lg">0</span> 分
                </div>
            </div>

            <!-- 題目顯示區 -->
            <div class="text-center py-6 bg-gradient-to-b from-yellow-50 to-orange-50 rounded-2xl border-2 border-dashed border-yellow-300 relative">
                <div id="challenge-badge" class="hidden absolute top-2 right-2 bg-red-500 text-white text-xs font-bold px-2.5 py-1 rounded-full animate-pulse shadow">
                    🔥 挑戰題 (+2分)
                </div>
                <div class="text-5xl md:text-6xl font-black text-gray-800 tracking-wider my-4" id="question-text">
                    3 × 4 = ?
                </div>
            </div>

            <!-- 答案選項 (4個按鈕) -->
            <div id="options-grid" class="grid grid-cols-2 gap-3.5">
                <!-- 動態生成選項 -->
            </div>

            <div id="feedback-msg" class="text-center font-bold h-6 text-sm"></div>
        </div>

        <!-- 畫面三：結算畫面 -->
        <div id="result-screen" class="hidden text-center space-y-6 py-4">
            <div class="text-6xl bouncing">🎉</div>
            <div class="space-y-2">
                <h2 class="text-3xl font-black text-gray-800">挑戰完成！</h2>
                <p class="text-gray-600 font-medium"><span id="result-name"></span> 同學，做得好！</p>
            </div>

            <div class="bg-orange-50 p-6 rounded-2xl max-w-xs mx-auto border border-orange-200">
                <div class="text-sm text-gray-500 font-bold">本次獲得總分</div>
                <div class="text-5xl font-black text-orange-500 my-2" id="final-score">0</div>
                <div id="sync-status" class="text-xs text-green-600 font-bold mt-2">分數已成功上傳並累積！</div>
            </div>

            <div class="flex gap-3 max-w-xs mx-auto">
                <button onclick="resetGame()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 rounded-xl transition">
                    重新挑戰
                </button>
                <button onclick="openLeaderboard()" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-xl shadow transition">
                    查看排行榜
                </button>
            </div>
        </div>

    </div>

    <!-- 排行榜 Modal -->
    <div id="leaderboard-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-md rounded-3xl p-6 card-shadow space-y-4 max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-xl font-extrabold text-gray-800 flex items-center gap-2">
                    🏆 乘法英雄榜 Top 10
                </h3>
                <button onclick="closeLeaderboard()" class="text-gray-400 hover:text-gray-600 text-xl font-bold px-2">✕</button>
            </div>

            <div id="leaderboard-list" class="overflow-y-auto flex-1 space-y-2 pr-1">
                <!-- 動態載入排行榜資料 -->
                <div class="text-center py-8 text-gray-400">載入中...</div>
            </div>

            <button onclick="closeLeaderboard()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 rounded-xl transition">
                關閉
            </button>
        </div>
    </div>

    <!-- 遊戲邏輯 Script -->
    <script>
        // ==========================================
        // 請在此處填入你的 Google Apps Script 網頁應用程式網址
        // ==========================================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx2pbSkmEA9p5YK-CTcyzBO8DqZyIzZJ2R3RpDATCJcuwJVJDmdDP_mLkFYsT11gYL8Sg/exec"
        let currentUser = { class: '2A', name: '' };
        let currentQuestionIndex = 0;
        let score = 0;
        let questions = [];
        const TOTAL_QUESTIONS = 10;

        function startGame() {
            const studentClass = document.getElementById('student-class').value;
            const studentName = document.getElementById('student-name').value.trim();

            if (!studentName) {
                alert('請輸入你的姓名！');
                return;
            }

            currentUser.class = studentClass;
            currentUser.name = studentName;
            score = 0;
            currentQuestionIndex = 0;

            generateQuestions();

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            loadQuestion();
        }

        // 生成 10 道題目 (包含普通題與挑戰題)
        function generateQuestions() {
            questions = [];
            for (let i = 0; i < TOTAL_QUESTIONS; i++) {
                // 第 8, 9, 10 題為挑戰題
                let isChallenge = i >= 7;
                let num1 = Math.floor(Math.random() * 8) + 2; // 2 ~ 9
                let num2 = Math.floor(Math.random() * 8) + 2; // 2 ~ 9
                let correctAnswer = num1 * num2;

                // 生成 3 個干擾選項
                let options = [correctAnswer];
                while (options.length < 4) {
                    let wrong = correctAnswer + (Math.floor(Math.random() * 5) - 2) * (Math.random() > 0.5 ? 1 : -1);
                    if (wrong > 0 && wrong <= 81 && !options.includes(wrong)) {
                        options.push(wrong);
                    }
                }
                options.sort(() => Math.random() - 0.5);

                questions.push({
                    num1, num2, correctAnswer, options, isChallenge
                });
            }
        }

        function loadQuestion() {
            if (currentQuestionIndex >= TOTAL_QUESTIONS) {
                endGame();
                return;
            }

            const q = questions[currentQuestionIndex];
            document.getElementById('current-question').textContent = currentQuestionIndex + 1;
            document.getElementById('current-score').textContent = score;
            document.getElementById('question-text').textContent = `${q.num1} × ${q.num2} = ?`;

            const badge = document.getElementById('challenge-badge');
            if (q.isChallenge) {
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            document.getElementById('feedback-msg').textContent = '';

            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "bg-orange-50 hover:bg-orange-100 border-2 border-orange-200 text-gray-800 font-extrabold text-2xl py-4 rounded-2xl shadow transition transform active:scale-95";
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(opt, q.correctAnswer, q.isChallenge, btn);
                grid.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct, isChallenge, btnElement) {
            // 停用所有選項避免連續點擊
            const buttons = document.querySelectorAll('#options-grid button');
            buttons.forEach(b => b.disabled = true);

            const feedback = document.getElementById('feedback-msg');
            const pointsEarned = isChallenge ? 2 : 1;

            if (selected === correct) {
                btnElement.className = "bg-green-500 border-2 border-green-600 text-white font-extrabold text-2xl py-4 rounded-2xl shadow transition transform scale-105";
                feedback.textContent = isChallenge ? "🔥 挑戰成功！ +2 分" : "⭕ 答對了！ +1 分";
                feedback.className = "text-center font-bold h-6 text-sm text-green-600";
                score += pointsEarned;
            } else {
                btnElement.className = "bg-red-500 border-2 border-red-600 text-white font-extrabold text-2xl py-4 rounded-2xl shadow transition";
                feedback.textContent = `❌ 答錯了，正確答案是 ${correct}`;
                feedback.className = "text-center font-bold h-6 text-sm text-red-500";
                
                // 高亮正確答案
                buttons.forEach(b => {
                    if (parseInt(b.textContent) === correct) {
                        b.className = "bg-green-500 border-2 border-green-600 text-white font-extrabold text-2xl py-4 rounded-2xl shadow";
                    }
                });
            }

            currentQuestionIndex++;
            setTimeout(loadQuestion, 1200);
        }

        function endGame() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('result-name').textContent = `${currentUser.class} ${currentUser.name}`;
            document.getElementById('final-score').textContent = score;

            // 撒花特效
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });

            // 自動上傳分數至 Google Sheet
            uploadScore();
        }

        function uploadScore() {
            const statusEl = document.getElementById('sync-status');
            statusEl.textContent = "正在將分數同步至雲端...";

            const data = {
                class: currentUser.class,
                name: currentUser.name,
                score: score
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', // Google Apps Script 跨域常用設定
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            }).then(() => {
                statusEl.textContent = "✨ 分數已成功累積到 Google Sheet！";
            }).catch(err => {
                console.error(err);
                statusEl.textContent = "⚠️ 上傳發生錯誤，請檢查網絡連線";
                statusEl.className = "text-xs text-red-600 font-bold mt-2";
            });
        }

        function resetGame() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('student-name').value = '';
        }

        function openLeaderboard() {
            document.getElementById('leaderboard-modal').classList.remove('hidden');
            document.getElementById('leaderboard-modal').classList.add('flex');
            fetchLeaderboard();
        }

        function closeLeaderboard() {
            document.getElementById('leaderboard-modal').classList.remove('flex');
            document.getElementById('leaderboard-modal').classList.add('hidden');
        }

        function fetchLeaderboard() {
            const listEl = document.getElementById('leaderboard-list');
            listEl.innerHTML = '<div class="text-center py-8 text-gray-400">正在下載排行榜資料...</div>';

            fetch(SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    if (!data || data.length === 0) {
                        listEl.innerHTML = '<div class="text-center py-8 text-gray-400">暫無排行榜資料</div>';
                        return;
                    }

                    let html = '';
                    data.forEach((item, index) => {
                        let rankStyle = "bg-gray-50 text-gray-700";
                        if (index === 0) rankStyle = "bg-yellow-100 text-yellow-800 border-2 border-yellow-300 font-black";
                        else if (index === 1) rankStyle = "bg-gray-200 text-gray-800 font-bold";
                        else if (index === 2) rankStyle = "bg-amber-100 text-amber-800 font-bold";

                        html += `
                            flex items-center justify-between p-3 rounded-2xl ${rankStyle}
                            <div class="flex items-center gap-3">
                                <span class="w-7 text-center font-black">${index + 1}</span>
                                <div>
                                    <span class="text-xs bg-white/60 px-2 py-0.5 rounded-md font-bold mr-1">${item.class}</span>
                                    <span class="font-bold">${item.name}</span>
                                </div>
                            </div>
                            <span class="font-extrabold text-orange-600">${item.score} 分</span>
                        </div>`;
                    });
                    listEl.innerHTML = html;
                })
                .catch(err => {
                    console.error(err);
                    listEl.innerHTML = '<div class="text-center py-8 text-red-400">無法載入排行榜，請確認 Google 網址是否正確</div>';
                });
        }
    </script>
</body>
</html>
