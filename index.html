<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小二乘法挑戰王</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app"><header><span>P2 數學遊戲</span><h1>✖️ 小二乘法挑戰王</h1><p>10 題挑戰，每題 1 分！</p></header>
<section id="start" class="panel"><h2>準備挑戰！</h2><p>龍虎榜只記錄名字、班別及分數。</p><form id="start-form"><label>名字<input id="name" maxlength="24" required></label><label>班別<input id="className" maxlength="12" placeholder="例如：2A" required></label><button>開始挑戰 🚀</button></form>
<div class="concept"><h3>乘法的意思</h3><p><b>3 × 4</b> 是「3 的 4 倍」：<b>4 組，每組 3 個</b>。</p><div class="demo"><span>● ● ●</span><span>● ● ●</span><span>● ● ●</span><span>● ● ●</span></div><p><b>3 + 3 + 3 + 3 = 12，所以 3 × 4 = 12</b></p></div></section>
<section id="quiz" class="panel hidden"><div class="top"><b id="player"></b><b id="progress"></b></div><div class="track"><div id="bar"></div></div><h2 id="question"></h2><p id="help"></p><div id="groups" class="demo"></div><div id="answers" class="answers"></div><p id="feedback" aria-live="polite"></p><button id="next" class="hidden">下一題 →</button></section>
<section id="result" class="panel hidden"><div class="trophy">🏆</div><h2>挑戰完成！</h2><p id="summary"></p><p id="submit-status" aria-live="polite"></p><button id="again">再玩一次</button></section>
<section class="panel"><div class="board-title"><h2>🏅 班級龍虎榜</h2><button id="refresh" class="secondary" type="button">更新榜單</button></div><p>只顯示名字、班別及分數；同一名字及班別只保留最高分。</p><div id="board"></div></section><footer>加油！🌟</footer></main><script src="config.js"></script><script src="questions.js"></script><script src="script.js"></script></body></html>
